name: Bug report
description: Report a reproducible defect or regression with a bounded expected outcome.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Provide evidence, not only a proposed implementation. Complete the fields needed to make this issue independently actionable.

  - type: input
    id: verified_revision
    attributes:
      label: Verified revision
      description: Commit SHA, release, or build where the behavior was verified.
      placeholder: main@0123456789abcdef or v0.1.0-alpha.1
    validations:
      required: true

  - type: dropdown
    id: affected_surface
    attributes:
      label: Affected surface
      options:
        - Core conversion contract
        - Infrastructure parser or converter
        - CLI
        - WebApp.Core presenter or state
        - WebApp browser UI or interop
        - Desktop host or Windows integration
        - Build, CI, release, or documentation
        - Multiple surfaces
    validations:
      required: true

  - type: textarea
    id: observed_behavior
    attributes:
      label: Observed behavior and evidence
      description: State what happens, how often, and the evidence that confirms it.
      placeholder: Include exact errors, screenshots, logs, or measurements where relevant. Remove secrets and personal data.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give deterministic steps and the smallest representative input.
      placeholder: |
        1. Start ...
        2. Open ...
        3. Perform ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe the observable corrected outcome without assuming an implementation.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Identify what must change and what must deliberately remain unchanged.
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and collision surface
      description: List blocking issues/PRs and likely shared files, capabilities, or contracts. Write "None known" when appropriate.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Use numbered, independently verifiable outcomes.
      placeholder: |
        AC1. ...
        AC2. ...
    validations:
      required: true

  - type: textarea
    id: test_contract
    attributes:
      label: Test contract
      description: Name existing tests that must remain and new unit, browser, integration, or manual evidence required.
      placeholder: Include success, boundary, failure, cancellation, concurrency, lifecycle, or regression cases that apply.
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - Low - local behavior with an established seam
        - Medium - multiple consumers or state/lifecycle impact
        - High - data loss, security, public contract, release, or cross-cutting architecture
    validations:
      required: true

  - type: checkboxes
    id: ready_check
    attributes:
      label: Readiness check
      options:
        - label: I searched for duplicate issues and confirmed this is not already resolved on the verified revision.
          required: true
        - label: I separated required behavior from optional implementation suggestions.
          required: true
        - label: I did not include unrelated cleanup or dependency upgrades in the requested scope.
          required: true
