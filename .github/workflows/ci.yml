name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Validate agent context tooling
        shell: pwsh
        run: ./scripts/agent/Get-AgentContext.ps1 -Mode Fast -Offline -OutputDirectory "${{ runner.temp }}/agent-context"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
