name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Validate agent context tooling
        shell: pwsh
        run: ./scripts/agent/Get-AgentContext.ps1 -Mode Fast -Offline -OutputDirectory "${{ runner.temp }}/agent-context"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish WebApp for GitHub Pages
        if: github.event_name != 'pull_request' && github.event.repository.private == false
        run: dotnet publish src/MarkdownConverter.WebApp/MarkdownConverter.WebApp.csproj --configuration Release --no-restore --output "${{ runner.temp }}/pages-publish"

      - name: Prepare GitHub Pages content
        if: github.event_name != 'pull_request' && github.event.repository.private == false
        shell: pwsh
        run: |
          $siteRoot = Join-Path $env:RUNNER_TEMP 'pages-publish/wwwroot'
          $indexPath = Join-Path $siteRoot 'index.html'
          $fallbackPath = Join-Path $siteRoot '404.html'
          $assetManifestPath = Join-Path $siteRoot 'service-worker-assets.js'
          $baseHref = '/${{ github.event.repository.name }}/'
          $rootBaseTag = '<base href="/" />'

          if (-not (Test-Path -LiteralPath $indexPath)) {
            throw "Published index was not found at '$indexPath'."
          }
          if (-not (Test-Path -LiteralPath $assetManifestPath)) {
            throw "Published service-worker asset manifest was not found at '$assetManifestPath'."
          }

          $index = Get-Content -Raw -LiteralPath $indexPath
          if (-not $index.Contains($rootBaseTag)) {
            throw 'The published index does not contain the expected root base tag.'
          }

          $index = $index.Replace($rootBaseTag, "<base href=`"$baseHref`" />")
          Set-Content -LiteralPath $indexPath -Value $index -Encoding utf8 -NoNewline

          $sha256 = [Security.Cryptography.SHA256]::Create()
          try {
            $indexHash = 'sha256-' + [Convert]::ToBase64String(
              $sha256.ComputeHash([IO.File]::ReadAllBytes($indexPath)))
          }
          finally {
            $sha256.Dispose()
          }

          $assetManifest = Get-Content -Raw -LiteralPath $assetManifestPath
          $indexAssetPattern = '(?<prefix>"hash"\s*:\s*")[^"]+(?<suffix>",\s*"url"\s*:\s*"index\.html")'
          $indexAssetMatches = [regex]::Matches($assetManifest, $indexAssetPattern)
          if ($indexAssetMatches.Count -ne 1) {
            throw "Expected exactly one index.html entry in '$assetManifestPath'."
          }

          $assetManifest = [regex]::Replace(
            $assetManifest,
            $indexAssetPattern,
            {
              param($match)
              "$($match.Groups['prefix'].Value)$indexHash$($match.Groups['suffix'].Value)"
            },
            1)
          Set-Content -LiteralPath $assetManifestPath -Value $assetManifest -Encoding utf8 -NoNewline

          Copy-Item -LiteralPath $indexPath -Destination $fallbackPath
          New-Item -Path (Join-Path $siteRoot '.nojekyll') -ItemType File -Force | Out-Null
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $siteRoot 'LICENSE.txt')
          Copy-Item -LiteralPath 'THIRD-PARTY-NOTICES.md' -Destination $siteRoot

          $requiredFiles = @(
            $indexPath,
            $fallbackPath,
            $assetManifestPath,
            (Join-Path $siteRoot '.nojekyll'),
            (Join-Path $siteRoot 'LICENSE.txt'),
            (Join-Path $siteRoot 'THIRD-PARTY-NOTICES.md'),
            (Join-Path $siteRoot '_framework/blazor.webassembly.js')
          )
          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missingFiles.Count -gt 0) {
            throw "GitHub Pages content is incomplete: $($missingFiles -join ', ')"
          }

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.event.repository.private == false
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-publish/wwwroot

  deploy-pages:
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
